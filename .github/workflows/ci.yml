name: Contributor CI & Validation

on:
  pull_request:
    branches: [ develop, main ]
  push:
    branches: [ 'feat/**', 'fix/**', 'contributor/**' ]

# Multi-contributor queue optimization: cancel previous in-flight runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-validation:
    name: .NET 10 Backend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore, Format & Build Backend
        run: |
          if ls *.sln 1> /dev/null 2>&1 || ls **/*.csproj 1> /dev/null 2>&1; then
            echo "Solution/Project detected. Running .NET validation suite..."
            dotnet restore
            dotnet format --verify-no-changes --verbosity diagnostic
            dotnet build --no-restore --configuration Release
            dotnet test --no-build --configuration Release --verbosity normal
          else
            echo "No .NET solution or project files present yet. Pipeline placeholder validated."
          fi

  frontend-validation:
    name: React & TypeScript Frontend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Lint, Typecheck & Test Frontend
        run: |
          if [ -f package.json ]; then
            echo "package.json detected. Running React & TypeScript validation suite..."
            npm ci
            npm run lint --if-present
            npm run typecheck --if-present
            npm test --if-present
            npm run build --if-present
          else
            echo "No package.json present yet. Pipeline placeholder validated."
          fi
