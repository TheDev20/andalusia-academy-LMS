name: Contributor CI & Validation

on:
  pull_request:
    branches: [ develop, main ]
  push:
    branches: [ 'feat/**', 'fix/**', 'contributor/**' ]

# Multi-contributor queue optimization: cancel previous in-flight runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-validation:
    name: .NET 10 Backend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Integration tests run against real SQL Server (rowversion, filtered indexes, UPDLOCK seat holds).
      # The SA password is generated per run so no credential is committed.
      - name: Start SQL Server for Integration Tests
        run: |
          SA_PASSWORD="Ci_$(openssl rand -hex 16)A1"
          echo "::add-mask::$SA_PASSWORD"
          docker run -d --name mssql -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$SA_PASSWORD" -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          for i in $(seq 1 60); do
            if docker exec mssql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$SA_PASSWORD" -Q "SELECT 1" > /dev/null 2>&1; then
              echo "SQL Server is ready."; break
            fi
            sleep 2
          done
          echo "ANDALUSIA_TEST_SQL_SERVER=Server=localhost,1433;User Id=sa;Password=$SA_PASSWORD;TrustServerCertificate=True" >> "$GITHUB_ENV"

      - name: Restore, Format & Build Backend
        run: |
          if ls *.sln 1> /dev/null 2>&1 || ls **/*.csproj 1> /dev/null 2>&1; then
            echo "Solution/Project detected. Running .NET validation suite..."
            dotnet restore
            dotnet format --verify-no-changes --verbosity diagnostic
            dotnet build --no-restore --configuration Release
            dotnet test --no-build --configuration Release --verbosity normal
          else
            echo "No .NET solution or project files present yet. Pipeline placeholder validated."
          fi

  frontend-validation:
    name: React & TypeScript Frontend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Lint, Typecheck & Test Frontend
        run: |
          if [ -f package.json ]; then
            echo "package.json detected. Running React & TypeScript validation suite..."
            npm ci
            npm run lint --if-present
            npm run typecheck --if-present
            npm test --if-present
            npm run build --if-present
          else
            echo "No package.json present yet. Pipeline placeholder validated."
          fi
