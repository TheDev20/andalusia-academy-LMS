name: Deploy to Production (Azure App Service)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Prevent overlapping deployments to production
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy to Azure
    runs-on: windows-latest
    environment:
      name: production
      url: https://andalusiaacademylms-ffegckcff9clxhkc2.westeurope-01.azurewebsites.net

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build React Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Restore Dependencies
        run: |
          if (Test-Path "AndalusiaAcademy.API\AndalusiaAcademy.API.csproj") {
            dotnet restore AndalusiaAcademy.API\AndalusiaAcademy.API.csproj
          }

      - name: Build & Publish Release Package with Frontend Assets
        run: |
          if (Test-Path "AndalusiaAcademy.API\AndalusiaAcademy.API.csproj") {
            dotnet publish AndalusiaAcademy.API\AndalusiaAcademy.API.csproj -c Release -o ./publish
            New-Item -ItemType Directory -Path "./publish/wwwroot" -Force | Out-Null
            Copy-Item -Path "frontend/dist/*" -Destination "./publish/wwwroot" -Recurse -Force
          } else {
            New-Item -ItemType Directory -Path "./publish" -Force | Out-Null
            Set-Content -Path "./publish/hostingstart.html" -Value "<h1>Andalusia Academy LMS - Production Deployment Initialized</h1>"
          }

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'AndalusiaAcademyLMS'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
